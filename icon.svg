<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- 
    FurVault App Icon
    Source: Lucide PawPrint Geometry (Scaled & Centered)
    Theme: Pink-500 to Violet-600 Gradient on Dark Slate Background
  -->
  
  <defs>
    <linearGradient id="furvault_gradient" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop stop-color="#EC4899"/> <!-- Pink-500 -->
      <stop offset="1" stop-color="#7C3AED"/> <!-- Violet-600 -->
    </linearGradient>
  </defs>

  <!-- Dark Background (Slate-900) -->
  <rect width="512" height="512" fill="#0f172a"/>

  <!-- Scaled from Lucide 24x24 grid to 512x512 -->
  <g transform="translate(42, 42) scale(17.8)" fill="url(#furvault_gradient)" stroke="url(#furvault_gradient)" stroke-width="0" stroke-linecap="round" stroke-linejoin="round">
    
    <!-- Toe 1 (Top Left) -->
    <circle cx="11" cy="4" r="2" />
    
    <!-- Toe 2 (Top Right) -->
    <circle cx="18" cy="8" r="2" />
    
    <!-- Toe 3 (Bottom Right) -->
    <circle cx="20" cy="16" r="2" />
    
    <!-- Main Pad -->
    <path d="M9 10a5 5 0 0 1 5 5v3.5a3.5 3.5 0 0 1-6.84 1.045Q6.5 19.5 6 19a3 3 0 0 1-3-3v-1a5 5 0 0 1 5-5" />
    
  </g>
</svg>